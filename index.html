<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      try {
        document.documentElement.dataset.theme =

            ? "light"
            : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;650;700;800&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta
      name="description"
      content="Entrelinhas: um jogo sobre pistas, intuição e estar na mesma sintonia. Jogue com seus amigos."
    />
    <title>Entrelinhas · Na mesma sintonia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
